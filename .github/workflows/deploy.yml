# This repository deploys from main/(root) with .nojekyll. GitHub Pages itself
# publishes committed HTML. This workflow checks output; it DOES NOT deploy.
name: Verify static GitHub Pages site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout prebuilt site
        uses: actions/checkout@v4
      - name: Install Node.js (no npm install required)
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Rebuild static HTML without Astro/npm dependencies
        run: python3 scripts/build-static-from-astro.py --source _astro-source --output .
      - name: Ensure generated pages are committed
        run: |
          git diff --exit-code -- index.html 404.html guide how-it-works configuration examples calculator commands faq assets/site.css assets/site.js assets/diagrams.js assets/limitMath.mjs
      - name: Verify GitHub Pages output
        run: python3 scripts/verify-site.py
